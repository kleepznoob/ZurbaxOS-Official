<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Six creative tools in one browser tab: photo editing, background cutout, design artboards, batch resizing, colour palettes and PDF page surgery. No install, no account, no subscription. Your files never leave your device.">
<meta name="theme-color" content="#14161A">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:title" content="Toolsmith — six creative tools, one tab">
<meta property="og:description" content="Photo, Cutout, Design, Batch, Colour and PDF. Pay once, not every month.">
<meta name="twitter:card" content="summary">
<title>Toolsmith — six creative tools in one tab</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/app.css">

</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a4.5 4.5 0 0 0 5.9 5.9L21 13l-8 8a2.1 2.1 0 0 1-3-3l8-8z"/>
          <path d="M6.5 3 3 6.5 6 9l2.5-2.5z"/><path d="m8 8 5 5"/>
        </svg>
      </span>
      <span class="brand-name">Toolsmith</span>
      <span class="brand-sub" id="tool-caption">Photo</span>
    </div>
    <div class="topbar-right">
      <span class="plan-badge" id="plan-badge" hidden></span>
      <button class="chip" type="button" id="theme-toggle">Light</button>
      <button class="chip" type="button" id="about-btn">About</button>
    </div>
  </header>

  <nav class="rail" id="rail" aria-label="Tools"></nav>

  <main class="stage" id="stage" tabindex="-1"></main>

  <aside class="inspector" id="inspector" aria-label="Tool settings"></aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="sheet-wrap" id="sheet-wrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title">Title</h2>
      <button class="sheet-x" type="button" id="sheet-close" aria-label="Close">&times;</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/license.js"></script>
<script src="js/photo.js"></script>
<script src="js/cutout.js"></script>
<script src="js/design.js"></script>
<script src="js/batch.js"></script>
<script src="js/color.js"></script>
<script src="js/pdfkit.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
