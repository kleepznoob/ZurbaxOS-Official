summary = Play chess against the computer, from beginner to expert
description = A calm chess board with a computer opponent that thinks in the background. Choose how strong it plays, from Easy to Expert.\nEvery rule is there: castling, en passant, promotion, and draws by repetition, the fifty-move rule or too little material. Moves are listed as you play, and you can take one back or turn the board around.
