description = A simple painting app with soft brushes, an eraser, lines, rectangles and ellipses, a paint bucket and a color picker.\nOpen a PNG, JPEG, GIF or BMP picture to mark it up, or start on a blank page, and save your work as PNG. Every stroke can be undone.
