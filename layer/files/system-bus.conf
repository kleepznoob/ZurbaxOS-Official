<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Zurbax's system bus, for a GNOME session: zsys (root) answers there
     for logind, UPower, AccountsService, polkit, NetworkManager and the
     rest, and checks itself who may change what. -->
<busconfig>
  <type>system</type>
  <listen>unix:path=/run/dbus/system_bus_socket</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow user="*"/>
    <allow send_destination="*" eavesdrop="true"/>
    <allow receive_sender="*"/>
    <allow own="*"/>
    <deny own="org.freedesktop.login1"/>
    <deny own="org.freedesktop.UPower"/>
    <deny own="org.freedesktop.Accounts"/>
    <deny own="org.freedesktop.PolicyKit1"/>
    <deny own="org.freedesktop.NetworkManager"/>
    <deny own="org.freedesktop.hostname1"/>
    <deny own="org.freedesktop.locale1"/>
    <deny own="org.freedesktop.timedate1"/>
    <deny own="org.freedesktop.UPower.PowerProfiles"/>
    <deny own="net.hadess.PowerProfiles"/>
    <deny own="org.gnome.DisplayManager"/>
  </policy>
  <policy user="root">
    <allow own="*"/>
  </policy>
  <limit name="max_incoming_bytes">133169152</limit>
  <limit name="max_message_size">33554432</limit>
</busconfig>
