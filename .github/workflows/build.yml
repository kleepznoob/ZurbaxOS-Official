# Builds ZOS, runs the tests and produces the bootable USB image and ISO,
# with the Linux layer for Steam and Proton on them.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The Linux layer (layer/build.sh): glibc, GCC, Mesa, Xwayland and the rest,
  # built from source. That takes a few hours, so the finished image is kept
  # in the cache until something in layer/ changes.
  layer:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Cache the layer image
        id: cache
        uses: actions/cache@v4
        with:
          path: build/layer/steam.sfs
          key: layer-${{ hashFiles('layer/**') }}

      - name: Make room (the build needs about 10 GB at its peak)
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ gcc-multilib g++-multilib make bc flex bison gawk gperf texinfo perl python3 python3-venv \
            autoconf automake libtool libltdl-dev pkg-config gettext xsltproc cmake ninja-build \
            libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev libzstd-dev libexpat1-dev x11proto-dev \
            llvm-18-dev clang-18 libclang-18-dev libclang-cpp18-dev libclc-18-dev llvm-spirv-18 \
            libllvmspirvlib-18-dev spirv-tools glslang-tools squashfs-tools curl xz-utils bzip2

      - name: Build the layer
        if: steps.cache.outputs.cache-hit != 'true'
        run: layer/build.sh

      - name: Hand the layer image to the image job
        uses: actions/upload-artifact@v4
        with:
          name: steam-layer
          path: build/layer/steam.sfs
          compression-level: 0
          retention-days: 3

  image:
    needs: layer
    # without a layer (its build failed) the image is still made, just without Steam's layer
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make bc flex bison libelf-dev libssl-dev cpio xz-utils

      - name: Cache the kernel source and build
        uses: actions/cache@v4
        with:
          path: |
            build/linux-*
            build/kernel
          key: kernel-${{ hashFiles('kernel/build.sh', 'kernel/zurbax.config') }}

      - name: Cache the Wi-Fi and GPU firmware
        uses: actions/cache@v4
        with:
          path: build/firmware
          key: firmware-${{ hashFiles('tools/fetch-firmware.py', 'kernel/gpu-firmware.txt') }}

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        run: make test

      - name: Get the layer image
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: steam-layer
          path: build/layer

      - name: Build the bootable image
        run: make image

      - name: Upload the ISO and the USB image
        uses: actions/upload-artifact@v4
        with:
          name: zos-2.0-golden-rain
          path: |
            build/zos.iso
            build/zos.img
          compression-level: 9
