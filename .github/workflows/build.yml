# Builds Zurbax, runs the tests and produces the bootable USB image and ISO,
# with the Linux layer (GNOME, Steam, Proton, Flatpak) and the firmware of
# every device on them. Started by hand with a
# tag name, it also publishes the images as that release.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the images as this release tag (for example v2.0.0); leave empty for a normal build"
        required: false
        default: ""

# a newer push replaces the build of the one before (the layer keeps what it
# finished either way)
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The Linux layer (layer/build.sh): glibc, GCC, Mesa, GNOME and the rest,
  # built from source. That takes longer than one job may run, so the build
  # keeps its progress (each finished package) in the cache and the next run
  # carries on; the finished image is kept until something in layer/ changes.
  layer:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Cache the layer image
        id: cache
        uses: actions/cache@v4
        with:
          path: build/layer/steam.sfs
          key: layer-${{ hashFiles('layer/**') }}

      - name: Make room (the build needs about 10 GB at its peak)
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ gcc-multilib g++-multilib make bc flex bison gawk gperf texinfo perl python3 python3-venv \
            autoconf automake libtool libltdl-dev pkg-config gettext xsltproc cmake ninja-build \
            libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev libzstd-dev libexpat1-dev x11proto-dev \
            llvm-18-dev clang-18 libclang-18-dev libclang-cpp18-dev libclc-18-dev llvm-spirv-18 \
            libllvmspirvlib-18-dev spirv-tools glslang-tools squashfs-tools curl xz-utils bzip2 \
            libglib2.0-dev libglib2.0-dev-bin libxml2-dev itstool libxml2-utils desktop-file-utils unzip

      # the sources too, so rebuilding the layer doesn't depend on every
      # project's server answering that day (some turn build machines away)
      - name: Cache the layer's sources
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: build/layer/src
          key: layer-src-${{ hashFiles('layer/sources.txt') }}
          restore-keys: layer-src-

      # what earlier runs built: the layer so far, its build tools and the
      # list of finished packages
      - name: Restore the layer's progress
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            build/layer/root
            build/layer/stamps
            build/layer/native
            build/layer/toolchain
            build/layer/venv
            build/layer/cargo
            build/layer/cargo-native
          key: layer-progress-${{ hashFiles('layer/**') }}-${{ github.run_id }}
          restore-keys: |
            layer-progress-${{ hashFiles('layer/**') }}-
            layer-progress-

      - name: Build the layer
        id: build
        if: steps.cache.outputs.cache-hit != 'true'
        # stop in time to save the progress; the next run continues from there
        run: timeout 300m layer/build.sh

      - name: Save the layer's progress
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/layer/root
            build/layer/stamps
            build/layer/native
            build/layer/toolchain
            build/layer/venv
            build/layer/cargo
            build/layer/cargo-native
          key: layer-progress-${{ hashFiles('layer/**') }}-${{ github.run_id }}

      - name: Hand the layer image to the image job
        uses: actions/upload-artifact@v4
        with:
          name: steam-layer
          path: build/layer/steam.sfs
          compression-level: 0
          retention-days: 3

  # the apps that come ready to use, offline (tools/preload-apps.sh)
  apps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Make room
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install Flatpak
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends flatpak squashfs-tools
      - name: Build the app images
        run: tools/preload-apps.sh build/preload
      - name: Hand them to the image jobs
        uses: actions/upload-artifact@v4
        with:
          name: preloaded-apps
          path: build/preload/*.sfs
          compression-level: 0
          retention-days: 2

  # the install image for every computer, and the mini one
  image:
    needs: [layer, apps]
    # without a layer (its build failed) the images are still made, just without it
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Make room (the image is over 6 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make bc flex bison libelf-dev libssl-dev cpio xz-utils squashfs-tools kmod

      - name: Cache the kernel source and build
        uses: actions/cache@v4
        with:
          path: |
            build/linux-*
            build/kernel
          key: kernel-${{ hashFiles('kernel/build.sh', 'kernel/zurbax.config', 'kernel/modules.config', 'kernel/patches/*') }}
          restore-keys: kernel-

      - name: Cache the Wi-Fi and GPU firmware
        uses: actions/cache@v4
        with:
          path: build/firmware
          key: firmware-${{ hashFiles('tools/fetch-firmware.py', 'kernel/gpu-firmware.txt') }}

      # on its own, so a failed download stops the build instead of leaving
      # the image without GPU and Wi-Fi firmware (make only warns)
      - name: Fetch the Wi-Fi and GPU firmware
        run: python3 tools/fetch-firmware.py build/firmware

      # every device's firmware (linux-firmware's newest release) as its own
      # image; kept for the month, since linux-firmware releases monthly
      - name: Name the month
        id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache the firmware image
        uses: actions/cache@v4
        with:
          path: build/firmware.sfs
          key: firmware-all-${{ hashFiles('tools/fetch-firmware.py', 'Makefile') }}-${{ steps.month.outputs.month }}

      - name: Build the firmware image
        run: make firmware

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        run: make test

      - name: Get the layer image
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: steam-layer
          path: build/layer

      - name: Get the apps that come with Zurbax
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: preloaded-apps
          path: build/preload

      - name: Build the images
        run: make iso iso-mini

      - name: Upload the images
        uses: actions/upload-artifact@v4
        with:
          name: zurbax-images
          path: |
            build/zurbax.iso
            build/zurbax-mini.iso
          compression-level: 0
          retention-days: 5

  # the release itself (its notes), then the images into it
  release:
    needs: image
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file docs/release-notes.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Zurbax 2.0" --notes-file docs/release-notes.md
          fi

  release-files:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Get the images
        uses: actions/download-artifact@v4
        with:
          name: zurbax-images
          path: build
      # GitHub keeps release files under 2 GiB: the full image goes up in parts
      - name: Add them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          cd build
          sha256sum zurbax.iso zurbax-mini.iso > SHA256SUMS
          split -b 1900M -d -a 1 zurbax.iso zurbax.iso.part
          gh release upload "$TAG" SHA256SUMS zurbax-mini.iso zurbax.iso.part* --clobber
